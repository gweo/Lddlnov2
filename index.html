<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon List</title>
    <style>
        /* Base Page Setup */
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Left Side: The Scrollable Level List */
        .list-side { width: 35%; max-width: 400px; min-width: 250px; background: #161616; border-right: 2px solid #222; overflow-y: auto; height: 100%; }
        .list-header { padding: 20px; background: #1a1a1a; text-align: center; border-bottom: 2px solid #222; }
        .list-header h1 { margin: 0; color: #ff4757; font-size: 1.5rem; }
        
        .list-item { display: flex; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; transition: background 0.2s; }
        .list-item:hover { background: #202020; }
        .rank { font-weight: bold; color: #ffa502; width: 40px; }
        .name { flex-grow: 1; font-weight: bold; }
        .creator { color: #888; font-size: 0.85rem; display: block; margin-top: 2px; }

        /* Right Side: The Main Details View */
        .main-side { width: 65%; flex-grow: 1; overflow-y: auto; padding: 40px; height: 100%; display: flex; flex-direction: column; gap: 30px; }
        
        /* Video Embed Setup (Maintains 16:9 ratio) */
        .video-box { width: 100%; max-width: 700px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
        .video-box iframe { width: 100%; height: 100%; border: none; }

        /* Record Stats Grid */
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; max-width: 700px; }
        .info-card { background: #1c1c1c; padding: 15px; border-radius: 6px; border-left: 4px solid #ff4757; }
        .info-card label { display: block; font-size: 0.8rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .info-card span { font-size: 1.2rem; font-weight: bold; }

        /* Records Table Section */
        .records-section { max-width: 700px; }
        .records-section h3 { border-bottom: 2px solid #333; padding-bottom: 8px; margin-top: 0; }
        .record-row { display: flex; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid #222; }
        .record-row a { color: #3742fa; text-decoration: none; font-weight: bold; }
        .record-row a:hover { text-decoration: underline; }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; height: auto; }
            .list-side { width: 100%; max-width: none; height: 350px; border-right: none; border-bottom: 2px solid #222; }
            .main-side { width: 100%; height: auto; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- LEFT SIDE: LEVEL LIST -->
    <div class="list-side">
        <div class="list-header">
            <h1>Top Demons</h1>
        </div>
        
        <!-- LEVEL #1 ITEM -->
        <div class="list-item" onclick="loadLevel('Acheron', 'Riot & more', '100%', 'https://youtube.com')">
            <span class="rank">#1</span>
            <div>
                <span class="name">Acheron</span>
                <span class="creator">by Riot & more</span>
            </div>
        </div>
        
        <!-- LEVEL #2 ITEM -->
        <div class="list-item" onclick="loadLevel('Silent Clubstep', 'Sailent', '100%', 'https://youtube.com')">
            <span class="rank">#2</span>
            <div>
                <span class="name">Silent Clubstep</span>
                <span class="creator">by Sailent</span>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE: POINTERCRATE DETAILS MAIN AREA -->
    <div class="main-side">
        <div>
            <h1 id="display-name" style="margin: 0 0 5px 0; font-size: 2.5rem;">Acheron</h1>
            <p id="display-creator" style="margin: 0; color: #aaa;">by Riot & more</p>
        </div>

        <!-- Video Showcase -->
        <div class="video-box">
            <iframe id="display-video" src="https://youtube.com" allowfullscreen></iframe>
        </div>

        <!-- Level Info Cards -->
        <div class="info-grid">
            <div class="info-card">
                <label>Requirement</label>
                <span id="display-req">100%</span>
            </div>
            <div class="info-card">
                <label>Points</label>
                <span>250.00</span>
            </div>
        </div>

        <!-- Approved Player Records List -->
        <div class="records-section">
            <h3>Approved Records</h3>
            
            <div class="record-row">
                <span>Zoink (100%)</span>
                <a href="https://youtube.com" target="_blank">Watch Video</a>
            </div>
            <div class="record-row">
                <span>Trick (100%)</span>
                <a href="https://youtube.com" target="_blank">Watch Video</a>
            </div>
        </div>
    </div>

    <!-- Layout Logic Script -->
    <script>
        function loadLevel(name, creator, req, videoUrl) {
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-creator').innerText = "by " + creator;
            document.getElementById('display-req').innerText = req;
            document.getElementById('display-video').src = videoUrl;
        }
    </script>
</body>
</html>
